[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p nicegui.testing.user_plugin -m "not slow and not native and not gpu and not soak and not bench"
main_file = gui.py
markers =
    scenario(name): FakeEngine scenario a page test starts from
    slow: imports chatterbox or torch (never loads a model)
    native: opens a native window (only with the user's go-ahead)
    gpu: loads real models (only with the user's go-ahead)
    soak: long reliability runs (random actions, long sessions); opt-in with -m soak
    bench: timing and scale benchmarks with a report; opt-in with -m bench
filterwarnings =
    error::pytest.PytestDeprecationWarning
