# Emiya theme manifest (BUILD_SPEC section 6.1). gui.py reads it before NiceGUI starts, in the server and in
# the window process; the window chrome and dark mode change only with a restart.

slug = "emiya"
name = "Emiya"
contract = [1, 0]
dark = true
css = ["emiya.css"]                  # emiya.css @imports pages/*.css

[window]
title = "Emiya Voice"                # M L5
frameless = true
size = [1280, 800]                   # M L19
min_size = [1280, 800]
resizable = false
background_color = "#0D0E10"         # M L17
text_select = false
center = true
icon = "static/icon.ico"

[palette]
primary = "#FCDB7F"
dark_page = "#0D0E10"
negative = "#F0706E"
warning = "#F2C14E"

[fx]
fps_cap = 60

[prefs]
fx_on = true
fx_speed = 100
work_glow = true
saber_art = "show"
